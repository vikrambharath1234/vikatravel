            width: 250px;

            background: #ab9a9a;
            

        }

            display: n;
        }
       
       
     </style>
</head>
<body>


   <div class="navbar  container bg-body ">
    <div class="navbar-brand ">
       <img src="images/images.png" alt="" width="200px">    </div>
    <ul class="nav mynav  ">
        <li class="nav-item ">
            <button  onclick="window.location.href='Home.html'" class="nav-link text-black">Home</button>
        </li>
        <li class="nav-item">
            <button  onclick="window.location.href='destination.html'"  class="nav-link text-black">Destination</button>
        </li>
        <li class="nav-item">
            <button class="nav-link text-black">Travel Plan</button>
        </li>
        <li class="nav-item">
            <button onclick="window.location.href='about.html'"  class="nav-link text-black">About Us</button>
        </li>
        <li class="nav-item">
            <button onclick="window.location.href='contact.html'" class="nav-link text-black">Contact Us</button>
        </li>
        <li class="btn mybtn">
            <button onclick="window.location.href='Signin.html'" class="btn btn-outline-dark bg-primary">Signin</button>
        </li>
        <li class="btn mybtn " >
            <button onclick="window.location.href='Signup.html'"  class=" btn btn-outline-dark bg-primary">Signup</button>
        </li>
    </ul>
</div>



    <div class="signinpage container-fluid " style="width: 700px; " >
        <form class="myform  text-center  bg-info-subtle   ">
        <h1 class="text-center text-decoration-underline p-5">SIGN IN</h1>
       
            <div class="gap-5 p-3 d-flex align-items-center justify-content-center">
                <h4>Enter Your Name:</h4>
                <input type="text" name="text" id="name" >
            </div>
            <div class="gap-5 p-3 d-flex align-items-center justify-content-center  ">
                <h4>Enter Your Email:</h4>
                <input type="text" name="email" id="email">
            </div>
            <div class="gap-5 p-3 d-flex justify-content-center align-items-center">
                <h4>Enter Your Password:</h4>
                <input type="password" name="password" id="password" >
                
            </div>
            <div class="text-center" id="msg">
                <p></p>
            </div>
            
          
            <div class="p-3 btn  " id="btn" >
                <button type="button">submit</button>
            </div>
        </form>
    </div>



    <!-- js -->
     <script>
 
        
        btn.addEventListener("click",function(){
     let btn= document.getElementById ("btn");
        let name=document.getElementById("name");
        let password=document.getElementById("password");
        let email=document.getElementById("email");
        let msg=document.getElementById("msg");
            if( name.value =="" ){
            msg.textContent=("*Name reqired *");
            msg.style.color=("red");}

            else if( email.value !== "@gmail.com"){
             msg.textContent=("*Email reqired *");
            msg.style.color=("red");
            }
            else if(password.value ===""){
             msg.textContent=("*Strong password reqired *");
            msg.style.color=("red");
            }
            else{
            msg.textContent=("*Login Successfully *");
            msg.style.color=("green");
            }
        });




     </script>
