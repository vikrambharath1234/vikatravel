<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
     <style>
        .myform h4{
            width: 250px;
            text-align: left;
        }
        input{
            width: 250px;
        }
        .nav-link:hover{
            background: #ab9a9a;
            

        }
       
     </style>
</head>
<body>

     
<div class="navbar  container bg-body ">
    <div class="navbar-brand ">
       <img src="images/images.png" alt="" width="200px">    </div>
    <ul class="nav mynav  ">
        <li class="nav-item ">
            <button  onclick="window.location.href='Home.html'" class="nav-link text-black">Home</button>
        </li>
        <li class="nav-item">
            <button  onclick="window.location.href='destination.html'"  class="nav-link text-black">Destination</button>
        </li>
        <li class="nav-item">
            <button class="nav-link text-black">Travel Plan</button>
        </li>
        <li class="nav-item">
            <button onclick="window.location.href='about.html'"  class="nav-link text-black">About Us</button>
        </li>
        <li class="nav-item">
            <button onclick="window.location.href='contact.html'" class="nav-link text-black">Contact Us</button>
        </li>
        <li class="btn mybtn">
            <button onclick="window.location.href='Signin.html'" class="btn btn-outline-dark bg-primary">Signin</button>
        </li>
        <li class="btn mybtn " >
            <button onclick="window.location.href='Signup.html'"  class=" btn btn-outline-dark bg-primary">Signup</button>
        </li>
    </ul>
</div>


    <div class="container-fluid ">
        <form class="myform text-center  bg-info-subtle p-4  ">
        <h1 class="text-center text-decoration-underline p-5">SIGN UP</h1>
       
            <div class="gap-5 p-3 d-flex align-items-center justify-content-center">
                <h4>Enter Your Full Name:</h4>
                <input type="text" name="name" id="name" >
            </div>
            <div class="gap-5 p-3 d-flex align-items-center justify-content-center  ">
                <h4>Enter Your Email:</h4>
                <input type="email" name="email" id="email" >
            </div>
            <div class="gap-5 p-3 d-flex justify-content-center align-items-center">
                <h4>Create New Password:</h4>
                <input type="password" name="password" id="password" >
            </div>
            <div class="gap-5 p-3 d-flex justify-content-center align-items-center">
                <h4>Confirm Password:</h4>
                <input type="password" name="password" id="newpassword" >
            </div>
            <div class="gap-5 p-3 d-flex justify-content-center align-items-center">
                <h4>Enter Phone Number:</h4>
                <input type="number" name="number" id="phone" >
            </div>
            <div id="msg"><p></p></div>
            <div class="p-3 btn  ">
                <button id="btn" type="button">submit</button>
            </div>
        </form>
    </div>


    <!-- js -->
     <script>
         btn.addEventListener("click",function(){
        let name= document.getElementById("name") ;
        let email = document.getElementById("email") ;
        let password = document.getElementById("password") ;
        let newpassword = document.getElementById("newpassword") ;
        let phone = document.getElementById("phone") ;
        let btn = document.getElementById("btn") ;
        let msg = document.getElementById("msg") ;
            if( name.value ===""){
                msg.textContent=("User name reqired");
                msg.style.color=("red");
            }
            else if( email.value != "@gmail.com"){
                msg.textContent=("Email required");
                msg.style.color=("red");
            }
            else if( password.value === ""){
                msg.textContent=("Password required");
                msg.style.color=("red");
            }
            else if( newpassword.value != password.value){
                msg.textContent=("Enter a Corret password");
                msg.style.color=("red");
            }
            else if( phone.value === ""){
                msg.textContent=("Phone number required");
                msg.style.color=("red");
            }
              else if( phone.value.length != 10 ){
                msg.textContent=("10 numbers required");
                msg.style.color=("red");
            }
            else{
                      msg.textContent=("Login Successfully");
                msg.style.color=("green");

            }
        })
        

        



     </script>


</body>
</html>
